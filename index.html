<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Asistencia al Grupo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FD4;
      --purple-bg: #EFEDFC;
      --text: #1A1A18;
      --muted: #8A8A80;
      --border: #E2E1DC;
      --bg: #F5F4F0;
      --card: #FFFFFF;
      --red: #D04030;
      --green: #1D9E75;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); }

    .login-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .login-header h1 span {
      color: var(--purple);
    }

    .login-header p {
      font-size: 13px;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px var(--purple-bg);
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .btn-login {
      background: var(--purple);
      color: white;
      grid-column: 1 / -1;
    }

    .btn-login:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-signup {
      background: var(--bg);
      color: var(--purple);
      border: 1px solid var(--border);
    }

    .btn-signup:hover {
      background: var(--purple-bg);
      border-color: var(--purple);
    }

    .btn-demo {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-demo:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .message {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    .message.error {
      background: #FCECEA;
      color: var(--red);
      border: 1px solid #E8C8C4;
      display: block;
    }

    .message.success {
      background: #EBF8F3;
      color: var(--green);
      border: 1px solid #C8E6DB;
      display: block;
    }

    .signup-form {
      display: none;
    }

    .signup-form.show {
      display: block;
    }

    .login-form {
      display: block;
    }

    .login-form.hide {
      display: none;
    }

    .divider {
      text-align: center;
      margin: 20px 0;
      font-size: 12px;
      color: var(--muted);
    }

    .divider::before,
    .divider::after {
      content: '─';
      display: inline-block;
      width: 60px;
      vertical-align: middle;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <!-- Formulario de Login -->
    <form class="login-form" onsubmit="handleLogin(event)">
      <div class="login-header">
        <h1>Asistencia <span>·</span> al Grupo</h1>
        <p>Ingresa con tu usuario</p>
      </div>

      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Tu usuario" required autofocus>
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" placeholder="Tu contraseña" required>
      </div>

      <div id="loginMessage" class="message"></div>

      <div class="form-actions">
        <button type="submit" class="btn btn-login" id="btnLogin">Ingresar</button>
      </div>
    </form>
  </div>
</div>

<script>
  const API_URL = 'https://factor-for-references-tiger.trycloudflare.com/api';

  async function handleLogin(e) {
    e.preventDefault();
    const usuario = document.getElementById('usuario').value;
    const contrasena = document.getElementById('contrasena').value;
    const btnLogin = document.getElementById('btnLogin');
    const loginMsg = document.getElementById('loginMessage');

    btnLogin.disabled = true;
    btnLogin.innerHTML = '<span class="spinner"></span>Ingresando...';

    try {
      const res = await fetch(API_URL + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, contrasena })
      });

      const data = await res.json();

      if (!res.ok) {
        loginMsg.textContent = data.error || 'Error al ingresar';
        loginMsg.classList.remove('success');
        loginMsg.classList.add('error');
      } else {
        sessionStorage.setItem('lider', JSON.stringify(data.lider));
        sessionStorage.setItem('discipulos', JSON.stringify(data.discipulos));

        loginMsg.textContent = '✓ Ingreso exitoso, redirigiendo...';
        loginMsg.classList.remove('error');
        loginMsg.classList.add('success');

        setTimeout(() => {
          window.location.href = 'app.html';
        }, 1000);
      }
    } catch (err) {
      loginMsg.textContent = 'Error de conexión con el servidor';
      loginMsg.classList.remove('success');
      loginMsg.classList.add('error');
      console.error(err);
    } finally {
      btnLogin.disabled = false;
      btnLogin.innerHTML = 'Ingresar';
    }
  }

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secretaria - Discipulos</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F4F0; --card: #FFFFFF; --text: #1A1A18; --muted: #8A8A80;
      --border: #E2E1DC; --green: #1D9E75; --green-bg: #EBF8F3;
      --red: #D04030; --red-bg: #FCECEA; --purple: #5B4FD4; --purple-bg: #EFEDFC;
      --teal: #0E7490; --teal-bg: #E0F2FE;
      --radius: 14px; --radius-sm: 9px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); }
    .app { max-width: 520px; margin: 0 auto; padding-bottom: 40px; }

    .header { padding: 40px 20px 12px; background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
    .header h1 span { color: var(--purple); }
    .header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .logout-btn { background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; white-space: nowrap; }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    .search-bar { position: relative; margin-bottom: 8px; }
    .search-bar input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'DM Sans', sans-serif; background: var(--card); color: var(--text); outline: none; }
    .search-bar input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-bg); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
    .filters { display: flex; gap: 8px; }
    .filters select { flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-family: 'DM Sans', sans-serif; background: var(--card); color: var(--text); outline: none; cursor: pointer; }
    .filters select:focus { border-color: var(--purple); }

    .section { padding: 12px 20px; }
    .section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }

    .disc-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
    .disc-card-top { display: flex; align-items: flex-start; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; background: var(--purple-bg); color: var(--purple); }
    .disc-info { flex: 1; min-width: 0; }
    .disc-nombre { font-size: 14px; font-weight: 600; }
    .disc-meta { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .disc-obs { font-size: 11px; color: var(--teal); margin-top: 4px; background: var(--teal-bg); padding: 4px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0; }

    .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-activo { background: var(--green-bg); color: var(--green); }
    .badge-inactivo { background: var(--red-bg); color: var(--red); }

    .action-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 11px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .action-btn.edit { color: var(--purple); border-color: var(--purple-bg); background: var(--purple-bg); }
    .action-btn.edit:hover { background: #e0dcf8; border-color: var(--purple); }
    .action-btn.deactivate:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
    .action-btn.activate:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }

    .empty { text-align: center; padding: 32px 20px; color: var(--muted); font-size: 13px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close { background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1; padding: 2px 6px; }
    .modal-close:hover { color: var(--text); }
    .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; color: var(--text); text-transform: uppercase; letter-spacing: 0.04em; }
    .form-group input, .form-group textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); outline: none; resize: vertical; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-bg); }
    .form-group textarea { min-height: 90px; line-height: 1.5; }

    .submit-btn { width: 100%; background: var(--purple); color: #fff; border: none; border-radius: var(--radius-sm); padding: 10px; font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 4px; }
    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 10px; padding: 9px 12px; border-radius: var(--radius-sm); font-size: 12px; text-align: center; display: none; }
    .msg.ok { display: block; background: var(--green-bg); color: var(--green); border: 1px solid #C8E6DB; }
    .msg.err { display: block; background: var(--red-bg); color: var(--red); border: 1px solid #E8C8C4; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-top">
      <div>
        <h1>Secretaria <span>·</span> Discipulos</h1>
        <div class="header-sub" id="headerSub">Cargando...</div>
      </div>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
    <div class="search-bar">
      <span class="search-icon">⌕</span>
      <input type="text" id="buscar" placeholder="Buscar por nombre o celular..." oninput="renderizar()">
    </div>
    <div class="filters">
      <select id="filtroEstado" onchange="renderizar()">
        <option value="activos">Activos</option>
        <option value="inactivos">Inactivos</option>
        <option value="todos">Todos</option>
      </select>
      <select id="filtroLider" onchange="renderizar()">
        <option value="">Todos los líderes</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title" id="countLabel">Cargando...</div>
    <div id="discipulosList"><div class="empty">Cargando...</div></div>
  </div>

</div>

<!-- Modal editar -->
<div class="modal-overlay" id="modalEditar" onclick="cerrarModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">Editar discipulo</span>
      <button class="modal-close" onclick="cerrarModal()">×</button>
    </div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" id="eNombre" maxlength="100">
    </div>
    <div class="form-group">
      <label>Celular</label>
      <input type="text" id="eCelular" maxlength="20" placeholder="(opcional)">
    </div>
    <div class="form-group">
      <label>Fecha de nacimiento</label>
      <input type="date" id="eFechaNac">
    </div>
    <div class="form-group">
      <label>Observaciones</label>
      <textarea id="eObs" placeholder="Notas internas sobre el discipulo..."></textarea>
    </div>
    <div class="msg" id="modalMsg"></div>
    <button class="submit-btn" id="btnGuardar" onclick="guardarEdicion()">Guardar cambios</button>
  </div>
</div>

<script>
  const API_URL = 'https://resist-turn-condition-patterns.trycloudflare.com/api';

  const lider = JSON.parse(sessionStorage.getItem('lider') || 'null');
  if (!lider || (lider.rol !== 'secretaria' && lider.rol !== 'admin')) {
    window.location.href = 'index.html' + window.location.search;
  }

  let discipulos = [];
  let editandoId = null;

  document.getElementById('headerSub').textContent = lider ? `${lider.nombre}` : '';

  async function cargar() {
    try {
      const res = await fetch(`${API_URL}/admin/discipulos?lider_id=${lider.id}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error al cargar');
      discipulos = data.discipulos;
      poblarFiltroLider();
      renderizar();
    } catch (err) {
      document.getElementById('discipulosList').innerHTML = `<div class="empty">Error al cargar: ${err.message}</div>`;
    }
  }

  function poblarFiltroLider() {
    const lideres = [...new Map(discipulos.map(d => [d.lider_id, d.lider_nombre])).entries()];
    lideres.sort((a, b) => a[1].localeCompare(b[1]));
    const sel = document.getElementById('filtroLider');
    const current = sel.value;
    sel.innerHTML = '<option value="">Todos los líderes</option>';
    lideres.forEach(([id, nombre]) => {
      const o = document.createElement('option');
      o.value = id;
      o.textContent = nombre;
      if (String(id) === current) o.selected = true;
      sel.appendChild(o);
    });
  }

  function renderizar() {
    const q = document.getElementById('buscar').value.toLowerCase().trim();
    const estado = document.getElementById('filtroEstado').value;
    const liderId = document.getElementById('filtroLider').value;

    const filtrados = discipulos.filter(d => {
      if (estado === 'activos' && !d.activo) return false;
      if (estado === 'inactivos' && d.activo) return false;
      if (liderId && String(d.lider_id) !== liderId) return false;
      if (q && !d.nombre.toLowerCase().includes(q) && !(d.celular || '').toLowerCase().includes(q)) return false;
      return true;
    });

    document.getElementById('countLabel').textContent = `${filtrados.length} discipulo${filtrados.length !== 1 ? 's' : ''}`;

    if (!filtrados.length) {
      document.getElementById('discipulosList').innerHTML = '<div class="empty">Sin resultados</div>';
      return;
    }

    document.getElementById('discipulosList').innerHTML = filtrados.map(d => {
      const iniciales = d.nombre.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
      const meta = [d.grupo_nombre, d.lider_nombre].filter(Boolean).join(' · ');
      const obsHtml = d.observaciones
        ? `<div class="disc-obs" title="${escHtml(d.observaciones)}">${escHtml(d.observaciones)}</div>`
        : '';
      const badgeHtml = d.activo
        ? `<span class="badge badge-activo">Activo</span>`
        : `<span class="badge badge-inactivo">Inactivo</span>`;
      const toggleLabel = d.activo ? 'Desactivar' : 'Activar';
      const toggleClass = d.activo ? 'deactivate' : 'activate';
      return `
        <div class="disc-card">
          <div class="disc-card-top">
            <div class="avatar">${iniciales}</div>
            <div class="disc-info">
              <div class="disc-nombre">${escHtml(d.nombre)}</div>
              <div class="disc-meta">${escHtml(meta)}${d.celular ? ' · ' + escHtml(d.celular) : ''}</div>
              ${obsHtml}
            </div>
            <div class="card-actions">
              ${badgeHtml}
              <button class="action-btn edit" onclick="abrirModal(${d.id})">Editar</button>
              <button class="action-btn ${toggleClass}" onclick="toggleActivo(${d.id}, ${!d.activo})">${toggleLabel}</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function abrirModal(id) {
    const d = discipulos.find(x => x.id === id);
    if (!d) return;
    editandoId = id;
    document.getElementById('eNombre').value = d.nombre || '';
    document.getElementById('eCelular').value = d.celular || '';
    document.getElementById('eFechaNac').value = d.fecha_nacimiento || '';
    document.getElementById('eObs').value = d.observaciones || '';
    document.getElementById('modalSub').textContent = `${d.lider_nombre} · ${d.grupo_nombre || 'Sin grupo'}`;
    const msg = document.getElementById('modalMsg');
    msg.className = 'msg';
    msg.textContent = '';
    document.getElementById('modalEditar').classList.add('open');
  }

  function cerrarModal(e) {
    if (e && e.target !== document.getElementById('modalEditar')) return;
    document.getElementById('modalEditar').classList.remove('open');
    editandoId = null;
  }

  async function guardarEdicion() {
    if (!editandoId) return;
    const nombre = document.getElementById('eNombre').value.trim();
    if (!nombre) {
      mostrarMsg('El nombre es requerido', 'err');
      return;
    }
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    try {
      const res = await fetch(`${API_URL}/discipulos/${editandoId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          lider_id: lider.id,
          nombre,
          celular: document.getElementById('eCelular').value.trim(),
          fecha_nacimiento: document.getElementById('eFechaNac').value || null,
          observaciones: document.getElementById('eObs').value.trim() || null
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error al guardar');
      const idx = discipulos.findIndex(x => x.id === editandoId);
      if (idx !== -1) {
        discipulos[idx].nombre = nombre;
        discipulos[idx].celular = document.getElementById('eCelular').value.trim();
        discipulos[idx].fecha_nacimiento = document.getElementById('eFechaNac').value || null;
        discipulos[idx].observaciones = document.getElementById('eObs').value.trim() || null;
      }
      mostrarMsg('Guardado correctamente', 'ok');
      renderizar();
      setTimeout(() => cerrarModal(), 1200);
    } catch (err) {
      mostrarMsg(err.message, 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar cambios';
    }
  }

  async function toggleActivo(id, nuevoActivo) {
    try {
      const res = await fetch(`${API_URL}/discipulos/${id}/activo`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lider_id: lider.id, activo: nuevoActivo })
      });
      if (!res.ok) { const d = await res.json(); throw new Error(d.error); }
      const idx = discipulos.findIndex(x => x.id === id);
      if (idx !== -1) discipulos[idx].activo = nuevoActivo;
      renderizar();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  function mostrarMsg(txt, tipo) {
    const msg = document.getElementById('modalMsg');
    msg.textContent = txt;
    msg.className = 'msg ' + tipo;
  }

  function logout() {
    sessionStorage.clear();
    window.location.href = 'index.html' + window.location.search;
  }

  cargar();
</script>
</body>
</html>

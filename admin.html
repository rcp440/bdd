<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - Asistencia</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F4F0; --card: #FFFFFF; --text: #1A1A18; --muted: #8A8A80;
      --border: #E2E1DC; --green: #1D9E75; --green-bg: #EBF8F3;
      --red: #D04030; --red-bg: #FCECEA; --purple: #5B4FD4; --purple-bg: #EFEDFC;
      --radius: 14px; --radius-sm: 9px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); }
    .app { max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
    .header { padding: 52px 20px 16px; background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
    .header h1 span { color: var(--purple); }
    .back-btn { background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; }
    .back-btn:hover { border-color: var(--text); color: var(--text); }
    .section { padding: 16px 20px; }
    .section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .leader-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
    .leader-info { flex: 1; min-width: 0; }
    .leader-name { font-size: 14px; font-weight: 500; }
    .leader-sub { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; margin-right: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-admin { background: var(--purple-bg); color: var(--purple); }
    .badge-lider { background: var(--border); color: var(--muted); }
    .badge-activo { background: var(--green-bg); color: var(--green); }
    .badge-inactivo { background: var(--red-bg); color: var(--red); }
    .card-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .action-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 11px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .action-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
    .action-btn.activate:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }
    .action-btn.edit { color: var(--purple); border-color: var(--purple-bg); background: var(--purple-bg); }
    .action-btn.edit:hover { background: #e0dcf8; border-color: var(--purple); }
    .form-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; color: var(--text); text-transform: uppercase; letter-spacing: 0.04em; }
    .form-group input, .form-group select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-bg); }
    .form-hint { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .submit-btn { width: 100%; background: var(--purple); color: #fff; border: none; border-radius: var(--radius-sm); padding: 10px; font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 4px; }
    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 10px; padding: 9px 12px; border-radius: var(--radius-sm); font-size: 12px; text-align: center; display: none; }
    .msg.ok { display: block; background: var(--green-bg); color: var(--green); border: 1px solid #C8E6DB; }
    .msg.err { display: block; background: var(--red-bg); color: var(--red); border: 1px solid #E8C8C4; }
    .empty { text-align: center; padding: 24px; color: var(--muted); font-size: 13px; }

    /* Grupos */
    .grupo-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
    .grupo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .grupo-nombre { font-size: 13px; font-weight: 600; color: var(--purple); }
    .disc-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .disc-row:last-child { border-bottom: none; }
    .disc-name { font-size: 12px; flex: 1; }
    .mover-select { font-size: 11px; padding: 3px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; max-width: 110px; }
    .mini-input { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; background: var(--bg); outline: none; font-family: 'DM Sans', sans-serif; width: 100%; }
    .mini-input:focus { border-color: var(--purple); }
    .mini-btn { background: var(--purple); color: #fff; border: none; border-radius: var(--radius-sm); padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
    .mini-btn-ghost { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; font-size: 12px; cursor: pointer; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; line-height: 1; padding: 2px 6px; }
    .modal-close:hover { color: var(--text); }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <h1>Admin <span>·</span> Líderes</h1>
      <button class="back-btn" onclick="window.location.href='app.html'">← Volver</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Líderes registrados</div>
    <div id="lideresList"><div class="empty">Cargando...</div></div>
  </div>

  <div class="section">
    <div class="section-title">Nuevo líder</div>
    <div class="form-card">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="fNombre" placeholder="Nombre y apellido" maxlength="100">
      </div>
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="fUsuario" placeholder="Usuario para login" maxlength="50" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="fEmail" placeholder="email@ejemplo.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="fContrasena" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Fecha de nacimiento</label>
        <input type="date" id="fFechaNac">
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select id="fRol">
          <option value="lider">Líder</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <button class="submit-btn" id="btnCrear" onclick="crearLider()">Crear líder</button>
      <div id="formMsg" class="msg"></div>
    </div>
  </div>
</div>

<!-- Modal de grupos -->
<div class="modal-overlay" id="modalGrupos" onclick="if(event.target===this)document.getElementById('modalGrupos').classList.remove('open')">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <span class="modal-title" id="gruposTitle">Grupos</span>
      <button class="modal-close" onclick="document.getElementById('modalGrupos').classList.remove('open')">×</button>
    </div>
    <div style="margin-bottom:10px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">GC</span>
      <button class="mini-btn" onclick="toggleNuevoGrupoForm()">+ Nuevo GC</button>
    </div>
    <div id="nuevoGrupoForm" style="display:none;margin-bottom:12px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <input type="text" id="ngNombre" class="mini-input" placeholder="Nombre del GC">
        <div style="display:flex;gap:6px">
          <select id="ngDia" class="mini-input" style="flex:1">
            <option value="">Día...</option>
            <option>Lunes</option><option>Martes</option><option>Miércoles</option>
            <option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option>
          </select>
          <input type="time" id="ngHorario" class="mini-input" style="flex:0 0 auto;width:100px">
        </div>
        <input type="text" id="ngLugar" class="mini-input" placeholder="Lugar">
        <div style="display:flex;gap:6px">
          <button class="mini-btn" style="flex:1" onclick="crearGrupo()">Crear GC</button>
          <button class="mini-btn-ghost" onclick="toggleNuevoGrupoForm()">Cancelar</button>
        </div>
      </div>
      <div id="ngMsg" class="msg" style="margin-top:6px"></div>
    </div>
    <div id="gruposContainer"><div class="empty">Cargando...</div></div>
  </div>
</div>

<!-- Modal de edición -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Editar líder</span>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" id="eNombre" maxlength="100">
    </div>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="eUsuario" maxlength="50" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="eEmail">
    </div>
    <div class="form-group">
      <label>Rol</label>
      <select id="eRol">
        <option value="lider">Líder</option>
        <option value="admin">Administrador</option>
      </select>
    </div>
    <div class="form-group">
      <label>Fecha de nacimiento</label>
      <input type="date" id="eFechaNac">
    </div>
    <div class="form-group">
      <label>Nueva contraseña</label>
      <input type="password" id="eContrasena" placeholder="Dejar vacío para no cambiar" autocomplete="new-password">
      <div class="form-hint">Mínimo 6 caracteres si se ingresa</div>
    </div>
    <button class="submit-btn" id="btnGuardar" onclick="guardarEdicion()">Guardar cambios</button>
    <div id="editMsg" class="msg"></div>
  </div>
</div>

<script>
  const API_URL = 'https://resist-turn-condition-patterns.trycloudflare.com/api';
  const lider = JSON.parse(sessionStorage.getItem('lider'));

  if (!lider || lider.rol !== 'admin') {
    window.location.href = 'index.html';
    throw new Error('Sin permisos');
  }

  let editingId = null;
  let lideresCached = [];

  function fmtFecha(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function initials(n) {
    return n.trim().split(' ').slice(0, 2).map(w => w[0].toUpperCase()).join('');
  }

  async function loadLideres() {
    const container = document.getElementById('lideresList');
    try {
      const res = await fetch(`${API_URL}/lideres?lider_id=${lider.id}`);
      const data = await res.json();
      if (!data.lideres || !data.lideres.length) {
        container.innerHTML = '<div class="empty">No hay líderes registrados</div>';
        return;
      }
      lideresCached = data.lideres;
      container.innerHTML = data.lideres.map((l, i) => `
        <div class="leader-card">
          <div class="avatar" style="background:${l.rol === 'admin' ? 'var(--purple);color:#fff' : 'var(--purple-bg);color:var(--purple)'}">
            ${initials(l.nombre)}
          </div>
          <div class="leader-info">
            <div class="leader-name">${l.nombre}</div>
            <div class="leader-sub">${l.usuario} · ${l.email}${l.fecha_nacimiento ? ' · ' + fmtFecha(l.fecha_nacimiento) : ''}</div>
            <div style="margin-top:4px">
              <span class="badge ${l.rol === 'admin' ? 'badge-admin' : 'badge-lider'}">${l.rol}</span>
              <span class="badge ${l.activo ? 'badge-activo' : 'badge-inactivo'}">${l.activo ? 'activo' : 'inactivo'}</span>
            </div>
          </div>
          <div class="card-actions">
            <button class="action-btn edit" data-idx="${i}">Editar</button>
            <button class="action-btn edit" onclick="openGruposModal(${l.id}, \`${l.nombre.replace(/`/g,'\\`')}\`)">Grupos</button>
            ${l.id !== lider.id ? `<button class="action-btn ${l.activo ? '' : 'activate'}" data-id="${l.id}" data-activo="${l.activo}">${l.activo ? 'Desactivar' : 'Activar'}</button>` : ''}
          </div>
        </div>
      `).join('');

      container.querySelectorAll('[data-idx]').forEach(btn => {
        btn.addEventListener('click', () => openEdit(parseInt(btn.dataset.idx)));
      });
      container.querySelectorAll('[data-id]').forEach(btn => {
        btn.addEventListener('click', () => toggleActivo(parseInt(btn.dataset.id), btn.dataset.activo === 'true'));
      });
    } catch (err) {
      container.innerHTML = '<div class="empty">Error al cargar líderes</div>';
    }
  }

  function openEdit(idx) {
    const l = lideresCached[idx];
    editingId = l.id;
    document.getElementById('eNombre').value = l.nombre;
    document.getElementById('eUsuario').value = l.usuario;
    document.getElementById('eEmail').value = l.email;
    document.getElementById('eRol').value = l.rol;
    document.getElementById('eFechaNac').value = l.fecha_nacimiento || '';
    document.getElementById('eContrasena').value = '';
    document.getElementById('editMsg').className = 'msg';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModalDirect() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
  }

  async function guardarEdicion() {
    const nombre = document.getElementById('eNombre').value.trim();
    const usuario = document.getElementById('eUsuario').value.trim();
    const email = document.getElementById('eEmail').value.trim();
    const rol = document.getElementById('eRol').value;
    const contrasena = document.getElementById('eContrasena').value;
    const msg = document.getElementById('editMsg');
    const btn = document.getElementById('btnGuardar');

    msg.className = 'msg';
    if (!nombre || !usuario || !email) {
      msg.textContent = 'Nombre, usuario y email son requeridos';
      msg.className = 'msg err';
      return;
    }
    if (contrasena && contrasena.length < 6) {
      msg.textContent = 'La contraseña debe tener mínimo 6 caracteres';
      msg.className = 'msg err';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Guardando...';

    try {
      const fechaNac = document.getElementById('eFechaNac').value;
      const body = { lider_id: lider.id, nombre, usuario, email, rol, fecha_nacimiento: fechaNac || null };
      if (contrasena) body.contrasena = contrasena;

      const res = await fetch(`${API_URL}/lideres/${editingId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || 'Error al guardar';
        msg.className = 'msg err';
      } else {
        msg.textContent = '✓ Cambios guardados';
        msg.className = 'msg ok';
        loadLideres();
        setTimeout(() => closeModalDirect(), 1500);
      }
    } catch (err) {
      msg.textContent = 'Error de conexión';
      msg.className = 'msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar cambios';
    }
  }

  async function toggleActivo(id, activo) {
    if (!confirm(`¿${activo ? 'Desactivar' : 'Activar'} este líder?`)) return;
    try {
      const res = await fetch(`${API_URL}/lideres/${id}/activo`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lider_id: lider.id, activo: !activo })
      });
      if (res.ok) loadLideres();
      else alert('Error al actualizar');
    } catch (err) {
      alert('Error de conexión');
    }
  }

  async function crearLider() {
    const nombre = document.getElementById('fNombre').value.trim();
    const usuario = document.getElementById('fUsuario').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    const contrasena = document.getElementById('fContrasena').value;
    const rol = document.getElementById('fRol').value;
    const msg = document.getElementById('formMsg');
    const btn = document.getElementById('btnCrear');

    msg.className = 'msg';
    if (!nombre || !usuario || !email || !contrasena) {
      msg.textContent = 'Todos los campos son requeridos';
      msg.className = 'msg err';
      return;
    }
    if (contrasena.length < 6) {
      msg.textContent = 'La contraseña debe tener mínimo 6 caracteres';
      msg.className = 'msg err';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creando...';

    try {
      const fechaNacC = document.getElementById('fFechaNac').value;
      const res = await fetch(`${API_URL}/lideres`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lider_id: lider.id, nombre, usuario, email, contrasena, rol, fecha_nacimiento: fechaNacC || null })
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || 'Error al crear';
        msg.className = 'msg err';
      } else {
        msg.textContent = '✓ Líder creado exitosamente';
        msg.className = 'msg ok';
        document.getElementById('fNombre').value = '';
        document.getElementById('fUsuario').value = '';
        document.getElementById('fEmail').value = '';
        document.getElementById('fContrasena').value = '';
        document.getElementById('fRol').value = 'lider';
        document.getElementById('fFechaNac').value = '';
        loadLideres();
        setTimeout(() => { msg.className = 'msg'; }, 3000);
      }
    } catch (err) {
      msg.textContent = 'Error de conexión';
      msg.className = 'msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Crear líder';
    }
  }

  loadLideres();

  // ==================== GRUPOS ====================

  let gruposLiderId = null;
  let gruposData = [];

  function openGruposModal(liderId, liderNombre) {
    gruposLiderId = liderId;
    document.getElementById('gruposTitle').textContent = `Grupos de ${liderNombre}`;
    document.getElementById('nuevoGrupoForm').style.display = 'none';
    document.getElementById('ngNombre').value = '';
    document.getElementById('ngMsg').className = 'msg';
    document.getElementById('modalGrupos').classList.add('open');
    loadGrupos();
  }

  function toggleNuevoGrupoForm() {
    const f = document.getElementById('nuevoGrupoForm');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
    if (f.style.display === 'block') setTimeout(() => document.getElementById('ngNombre').focus(), 50);
  }

  async function loadGrupos() {
    const container = document.getElementById('gruposContainer');
    container.innerHTML = '<div class="empty">Cargando...</div>';
    try {
      const res = await fetch(`${API_URL}/grupos/${gruposLiderId}`);
      const data = await res.json();
      gruposData = data.grupos || [];

      if (!gruposData.length) {
        container.innerHTML = '<div class="empty">Sin GC. Creá el primero.</div>';
        return;
      }

      for (const g of gruposData) {
        const r = await fetch(`${API_URL}/discipulos/grupo/${g.id}`);
        const d = await r.json();
        g.discipulos = d.discipulos || [];
      }

      renderGrupos();
    } catch (err) {
      container.innerHTML = '<div class="empty">Error al cargar</div>';
    }
  }

  const DIAS_ADMIN = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

  function renderGrupos() {
    const container = document.getElementById('gruposContainer');
    container.innerHTML = gruposData.map(g => {
      const otrosGrupos = gruposData.filter(og => og.id !== g.id);
      const info = [g.dia, g.horario, g.lugar].filter(Boolean).join(' · ');
      const discsHtml = g.discipulos.length
        ? g.discipulos.map(d => `
            <div class="disc-row">
              <span class="disc-name">${d.nombre}</span>
              ${otrosGrupos.length ? `
                <select class="mover-select" onchange="moverDiscipulo(${d.id},this.value,${g.id},this)">
                  <option value="">Mover a...</option>
                  ${otrosGrupos.map(og => `<option value="${og.id}">${og.nombre}</option>`).join('')}
                </select>` : ''}
            </div>`).join('')
        : '<div style="color:var(--muted);font-size:12px;padding:4px 0">Sin discípulos</div>';

      const diasOpts = DIAS_ADMIN.map(d => `<option${g.dia===d?' selected':''}>${d}</option>`).join('');

      return `
        <div class="grupo-card">
          <div class="grupo-header">
            <div>
              <span class="grupo-nombre" id="gname-${g.id}">${g.nombre}</span>
              ${info ? `<div style="font-size:10px;color:var(--muted);margin-top:2px">${info}</div>` : ''}
            </div>
            <div style="display:flex;gap:4px">
              <button class="action-btn edit" style="font-size:12px" onclick="iniciarRenombrar(${g.id})">✏ Editar</button>
              <button class="action-btn" style="font-size:12px" onclick="confirmarDesactivarGrupo(${g.id})">✗</button>
            </div>
          </div>
          <div id="grename-${g.id}" style="display:none;margin-bottom:8px">
            <div style="display:flex;flex-direction:column;gap:6px">
              <input type="text" id="ri-n-${g.id}" class="mini-input" value="${g.nombre}" placeholder="Nombre del GC">
              <div style="display:flex;gap:6px">
                <select id="ri-d-${g.id}" class="mini-input" style="flex:1">
                  <option value="">Día...</option>${diasOpts}
                </select>
                <input type="time" id="ri-h-${g.id}" class="mini-input" style="flex:0 0 auto;width:100px" value="${g.horario||''}">
              </div>
              <input type="text" id="ri-l-${g.id}" class="mini-input" value="${g.lugar||''}" placeholder="Lugar">
              <div style="display:flex;gap:6px">
                <button class="mini-btn" style="flex:1" onclick="guardarRenombrar(${g.id})">Guardar</button>
                <button class="mini-btn-ghost" onclick="cancelarRenombrar(${g.id})">Cancelar</button>
              </div>
            </div>
          </div>
          <div style="margin-bottom:8px">${discsHtml}</div>
          <div id="addform-${g.id}" style="display:none;margin-bottom:6px">
            <div style="display:flex;flex-direction:column;gap:6px">
              <input type="text" id="adname-${g.id}" class="mini-input" placeholder="Nombre y apellido" onkeydown="if(event.key==='Enter')document.getElementById('adcel-${g.id}').focus()">
              <input type="tel" id="adcel-${g.id}" class="mini-input" placeholder="Celular (opcional)" onkeydown="if(event.key==='Enter')agregarDiscipuloGrupo(${g.id})">
              <div style="display:flex;gap:6px">
                <button class="mini-btn" style="flex:1" onclick="agregarDiscipuloGrupo(${g.id})">+ Agregar</button>
                <button class="mini-btn-ghost" onclick="document.getElementById('addform-${g.id}').style.display='none'">Cancelar</button>
              </div>
              <div id="addmsg-${g.id}" class="msg" style="margin-top:0"></div>
            </div>
          </div>
          <button class="action-btn edit" style="width:100%;text-align:center;font-size:12px" onclick="toggleAddDiscForm(${g.id})">+ Agregar discípulo</button>
        </div>`;
    }).join('');
  }

  function iniciarRenombrar(grupoId) {
    document.getElementById(`grename-${grupoId}`).style.display = 'block';
    document.getElementById(`ri-n-${grupoId}`).focus();
  }

  function cancelarRenombrar(grupoId) {
    document.getElementById(`grename-${grupoId}`).style.display = 'none';
  }

  async function guardarRenombrar(grupoId) {
    const nombre = document.getElementById(`ri-n-${grupoId}`).value.trim();
    const dia = document.getElementById(`ri-d-${grupoId}`).value;
    const horario = document.getElementById(`ri-h-${grupoId}`).value;
    const lugar = document.getElementById(`ri-l-${grupoId}`).value.trim();
    if (!nombre) return;
    try {
      const res = await fetch(`${API_URL}/grupos/${grupoId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lider_id: gruposLiderId, nombre, dia, horario, lugar })
      });
      if (res.ok) {
        const g = gruposData.find(g => g.id === grupoId);
        if (g) { g.nombre = nombre; g.dia = dia; g.horario = horario; g.lugar = lugar; }
        cancelarRenombrar(grupoId);
        renderGrupos();
      }
    } catch (err) { alert('Error al guardar GC'); }
  }

  async function confirmarDesactivarGrupo(grupoId) {
    const g = gruposData.find(g => g.id === grupoId);
    if (!confirm(`¿Desactivar "${g?.nombre}"?`)) return;
    try {
      await fetch(`${API_URL}/grupos/${grupoId}/activo`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lider_id: gruposLiderId, activo: false })
      });
      loadGrupos();
    } catch (err) { alert('Error al desactivar'); }
  }

  async function crearGrupo() {
    const nombre = document.getElementById('ngNombre').value.trim();
    const dia = document.getElementById('ngDia').value;
    const horario = document.getElementById('ngHorario').value;
    const lugar = document.getElementById('ngLugar').value.trim();
    const msg = document.getElementById('ngMsg');
    if (!nombre) { msg.textContent = 'Ingresá un nombre'; msg.className = 'msg err'; return; }
    try {
      const res = await fetch(`${API_URL}/grupos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lider_id: gruposLiderId, nombre, dia, horario, lugar })
      });
      if (res.ok) {
        document.getElementById('ngNombre').value = '';
        document.getElementById('nuevoGrupoForm').style.display = 'none';
        loadGrupos();
      } else {
        const d = await res.json();
        msg.textContent = d.error || 'Error'; msg.className = 'msg err';
      }
    } catch (err) { msg.textContent = 'Error de conexión'; msg.className = 'msg err'; }
  }

  function toggleAddDiscForm(grupoId) {
    const f = document.getElementById(`addform-${grupoId}`);
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
    if (f.style.display === 'block') setTimeout(() => document.getElementById(`adname-${grupoId}`).focus(), 50);
  }

  async function agregarDiscipuloGrupo(grupoId) {
    const nombre = document.getElementById(`adname-${grupoId}`).value.trim();
    const celular = document.getElementById(`adcel-${grupoId}`).value.trim();
    const msg = document.getElementById(`addmsg-${grupoId}`);
    if (!nombre) { msg.textContent = 'El nombre es requerido'; msg.className = 'msg err'; return; }
    try {
      const res = await fetch(`${API_URL}/discipulos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ grupo_id: grupoId, nombre, celular })
      });
      const data = await res.json();
      if (!res.ok) { msg.textContent = data.error || 'Error'; msg.className = 'msg err'; }
      else {
        msg.textContent = '✓ Discípulo agregado'; msg.className = 'msg ok';
        document.getElementById(`adname-${grupoId}`).value = '';
        document.getElementById(`adcel-${grupoId}`).value = '';
        loadGrupos();
      }
    } catch (err) { msg.textContent = 'Error de conexión'; msg.className = 'msg err'; }
  }

  async function moverDiscipulo(discId, nuevoGrupoId, grupoActualId, selectEl) {
    if (!nuevoGrupoId) return;
    const grupo = gruposData.find(g => g.id === grupoActualId);
    const disc = grupo?.discipulos.find(d => d.id === discId);
    if (!disc) return;
    try {
      const res = await fetch(`${API_URL}/discipulos/${discId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lider_id: gruposLiderId, nombre: disc.nombre, celular: disc.celular || '', grupo_id: parseInt(nuevoGrupoId) })
      });
      if (res.ok) loadGrupos();
      else { selectEl.value = ''; alert('Error al mover discípulo'); }
    } catch (err) { selectEl.value = ''; alert('Error de conexión'); }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Asistencia al Grupo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg: #F5F4F0;
      --card: #FFFFFF;
      --text: #1A1A18;
      --muted: #8A8A80;
      --border: #E2E1DC;
      --green: #1D9E75;
      --green-bg: #EBF8F3;
      --red: #D04030;
      --red-bg: #FCECEA;
      --purple: #5B4FD4;
      --purple-bg: #EFEDFC;
      --radius: 14px;
      --radius-sm: 9px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); }

    .app { max-width: 480px; margin: 0 auto; padding: 0 0 80px; min-height: 100vh; }

    /* HEADER */
    .header { padding: 52px 20px 16px; background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .header h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.2; }
    .header h1 span { color: var(--purple); }
    .header-info { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .logout-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 12px; font-weight: 600; padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .logout-btn:hover { background: var(--red-bg); border-color: var(--red); }
    .nav-btn { font-size: 11px; font-weight: 600; padding: 4px 8px; border: 1px solid var(--purple-bg); border-radius: var(--radius-sm); color: var(--purple); text-decoration: none; background: var(--purple-bg); white-space: nowrap; }

    .date-pill-wrap { position: relative; display: inline-block; margin-top: 4px; cursor: pointer; }
    .date-pill { font-family: 'DM Mono', monospace; font-size: 11px; background: var(--border); color: var(--muted); padding: 4px 10px; border-radius: 20px; white-space: nowrap; user-select: none; }
    .date-pill-wrap:hover .date-pill { background: var(--purple-bg); color: var(--purple); }
    .date-pill-wrap input[type="date"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 20px; }
    .stat { background: var(--card); border-radius: var(--radius); padding: 8px 10px; text-align: center; border: 1px solid var(--border); }
    .stat-num { font-size: 22px; font-weight: 600; letter-spacing: -1px; color: var(--text); }
    .stat-num.g { color: var(--green); }
    .stat-num.r { color: var(--red); }
    .stat-lbl { font-size: 10px; color: var(--muted); margin-top: 1px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* LIST */
    .list-header { padding: 4px 20px 10px; display: flex; align-items: center; justify-content: space-between; }
    .list-header span { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .list-header button { font-size: 12px; color: var(--purple); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; }
    .list { padding: 0 20px; display: flex; flex-direction: column; gap: 6px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; transition: border-color 0.15s, background 0.15s; }
    .card.presente { border-color: var(--green); background: var(--green-bg); }
    .card.ausente { border-color: #E8C8C4; background: var(--red-bg); }

    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; background: var(--purple-bg); color: var(--purple); }
    .card.presente .avatar { background: #D0F0E5; color: #0D6647; }
    .card.ausente .avatar { background: #F5D5D0; color: #8B2010; }

    .info { flex: 1; min-width: 0; }
    .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .phone-input { font-size: 11px; color: var(--muted); margin-top: 1px; font-family: 'DM Mono', monospace; background: transparent; border: none; outline: none; padding: 0; width: 100%; }
    .phone-input:focus { color: var(--text); }
    .obs-input { width: 100%; border: none; border-top: 1px solid rgba(0,0,0,0.08); background: transparent; font-size: 11px; font-family: 'DM Sans', sans-serif; color: var(--text); padding: 5px 2px 1px; outline: none; margin-top: 2px; }
    .obs-input::placeholder { color: var(--muted); font-style: italic; }
    .status-txt { font-size: 10px; margin-top: 1px; font-weight: 500; }
    .card.presente .status-txt { color: var(--green); }
    .card.ausente .status-txt { color: var(--red); }

    .btns { display: flex; gap: 4px; flex-shrink: 0; }
    .bp, .ba { border: 1px solid var(--border); border-radius: var(--radius-sm); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg); color: var(--muted); transition: all 0.1s; }
    .bp.on { background: var(--green); border-color: var(--green); color: #fff; }
    .ba.on { background: var(--red); border-color: var(--red); color: #fff; }

    /* ADD FORM */
    .add-section { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 20px 18px; z-index: 9; }
    .save-btn { width: 100%; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm); padding: 9px; font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .save-btn .icon { font-size: 15px; }

    /* TOAST */
    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--text); color: #fff; border-radius: 30px; padding: 10px 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap; z-index: 100; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { background: var(--green); }
    .toast.err { background: var(--red); }

    .empty { text-align: center; padding: 32px 20px; color: var(--muted); font-size: 14px; }
    #printReport { display: none; }

    /* OBSERVACIÓN DEL ENCUENTRO */
    .reunion-obs { width: 100%; border: none; border-top: 1px solid var(--border); background: transparent; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--text); padding: 6px 0 2px; outline: none; resize: none; margin-top: 6px; min-height: 32px; }
    .reunion-obs::placeholder { color: var(--muted); font-style: italic; }

    /* MODAL EDITAR DISCÍPULO */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 380px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; line-height: 1; padding: 2px 6px; }
    .modal-fg { margin-bottom: 12px; }
    .modal-fg label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
    .modal-fg input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); outline: none; }
    .modal-fg input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-bg); }
    .modal-save-btn { width: 100%; background: var(--purple); color: #fff; border: none; border-radius: var(--radius-sm); padding: 10px; font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }
    .modal-baja-btn { width: 100%; background: none; color: var(--red); border: 1px solid var(--red); border-radius: var(--radius-sm); padding: 8px; font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 8px; }
    .modal-msg { margin-top: 8px; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12px; text-align: center; display: none; }
    .modal-msg.ok { display: block; background: var(--green-bg); color: var(--green); }
    .modal-msg.err { display: block; background: var(--red-bg); color: var(--red); }
    .edit-disc-btn { border: 1px solid var(--purple-bg); border-radius: var(--radius-sm); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; background: var(--purple-bg); color: var(--purple); flex-shrink: 0; }
    .lider-name-btn { background: none; border: none; cursor: pointer; font-size: inherit; font-family: inherit; color: var(--purple); font-weight: 600; padding: 0; text-decoration: underline dotted; }

    /* SELECTOR DE GRUPO */
    .grupo-selector { position: fixed; inset: 0; background: var(--bg); z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; }
    .grupo-selector h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; text-align: center; }
    .grupo-selector p { font-size: 13px; color: var(--muted); margin-bottom: 28px; text-align: center; }
    .grupo-list { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
    .grupo-btn { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; color: var(--text); cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s; }
    .grupo-btn:hover { border-color: var(--purple); background: var(--purple-bg); color: var(--purple); }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div>
        <h1>Asistencia <span>·</span> al Grupo</h1>
        <div class="header-info" id="headerInfo"></div>
        <div class="date-pill-wrap" id="datePillWrap">
          <div class="date-pill" id="date-pill"></div>
          <input type="date" id="date-input" />
        </div>
        <textarea id="reunionObs" class="reunion-obs" placeholder="Observación del encuentro..." maxlength="500" rows="2"></textarea>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <button class="logout-btn" onclick="logout()">Salir</button>
        <div id="adminNav" style="display:none;gap:4px;"></div>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="sTotal">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-num g" id="sPres">0</div><div class="stat-lbl">Presentes</div></div>
    <div class="stat"><div class="stat-num r" id="sAus">0</div><div class="stat-lbl">Ausentes</div></div>
  </div>

  <div class="list-header">
    <span>Discípulos</span>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="nav-btn" onclick="openAddDiscModal()">+ Agregar</button>
      <button onclick="descargarCSV()" title="Descargar CSV" style="font-size:12px;color:var(--green);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;">⬇ CSV</button>
      <button onclick="imprimirPDF()" title="Informe PDF" style="font-size:12px;color:var(--purple);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;">⬇ PDF</button>
      <button id="toggleAllBtn" onclick="toggleAll()">Marcar todos</button>
    </div>
  </div>
  <div class="list" id="list"></div>
</div>

<div id="grupoSelector" class="grupo-selector" style="display:none">
  <h2 id="gsLiderNombre"></h2>
  <p>Seleccioná el grupo con el que vas a trabajar hoy</p>
  <div class="grupo-list" id="gsGrupos"></div>
</div>

<div class="add-section">
  <button class="save-btn" id="saveBtn" onclick="guardar()"><span class="icon">💾</span> Guardar asistencia</button>
</div>

<div class="toast" id="toast"></div>
<div id="printReport"></div>

<div class="modal-overlay" id="modalAddDisc" onclick="if(event.target===this)closeAddDiscModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Agregar discípulo</span>
      <button class="modal-close" onclick="closeAddDiscModal()">×</button>
    </div>
    <div class="modal-fg">
      <label>Nombre y apellido</label>
      <input type="text" id="nNombre" maxlength="50" placeholder="Nombre y apellido" onkeydown="if(event.key==='Enter')document.getElementById('nCel').focus()">
    </div>
    <div class="modal-fg">
      <label>Celular</label>
      <input type="tel" id="nCel" maxlength="20" placeholder="Ej: 2996205606" onkeydown="if(event.key==='Enter')document.getElementById('nFechaNac').focus()">
    </div>
    <div class="modal-fg">
      <label>Fecha de nacimiento</label>
      <input type="date" id="nFechaNac">
    </div>
    <button class="modal-save-btn" onclick="addPerson()">+ Agregar discípulo</button>
  </div>
</div>

<div class="modal-overlay" id="modalEditPerfil" onclick="if(event.target===this)closePerfilModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Mi perfil</span>
      <button class="modal-close" onclick="closePerfilModal()">×</button>
    </div>
    <div class="modal-fg">
      <label>Nombre completo</label>
      <input type="text" id="pfNombre" maxlength="100">
    </div>
    <div class="modal-fg">
      <label>Email</label>
      <input type="email" id="pfEmail" maxlength="100">
    </div>
    <div class="modal-fg">
      <label>Celular</label>
      <input type="tel" id="pfCelular" maxlength="20">
    </div>
    <div class="modal-fg">
      <label>Fecha de nacimiento</label>
      <input type="date" id="pfFechaNac">
    </div>
    <button class="modal-save-btn" id="btnGuardarPerfil" onclick="guardarPerfil()">Guardar cambios</button>
    <div class="modal-msg" id="perfilMsg"></div>
  </div>
</div>

<div class="modal-overlay" id="modalEditDisc" onclick="if(event.target===this)closeEditDiscModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Editar discípulo</span>
      <button class="modal-close" onclick="closeEditDiscModal()">×</button>
    </div>
    <div class="modal-fg">
      <label>Nombre completo</label>
      <input type="text" id="edNombre" maxlength="100">
    </div>
    <div class="modal-fg">
      <label>Celular</label>
      <input type="tel" id="edCelular" maxlength="20">
    </div>
    <div class="modal-fg">
      <label>Fecha de nacimiento</label>
      <input type="date" id="edFechaNac">
    </div>
    <button class="modal-save-btn" id="btnGuardarDisc" onclick="guardarDiscipulo()">Guardar cambios</button>
    <button class="modal-baja-btn" id="btnDarDeBaja" onclick="darDeBajaDisc()">Dar de baja</button>
    <div class="modal-msg" id="editDiscMsg"></div>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:3000/api';
  let lider = JSON.parse(sessionStorage.getItem('lider'));
  let grupo = JSON.parse(sessionStorage.getItem('grupo'));
  let grupos = JSON.parse(sessionStorage.getItem('grupos')) || [];
  let people = [];
  let selectedDate = new Date().toISOString().slice(0, 10);

  if (!lider) {
    window.location.href = 'index.html';
    throw new Error('No autenticado');
  }

  if (lider.rol === 'admin') {
    const nav = document.getElementById('adminNav');
    nav.style.display = 'flex';
    nav.innerHTML = '<a href="stats.html" class="nav-btn">Estadísticas</a><a href="admin.html" class="nav-btn">Admin</a>';
  }

  function showGrupoSelector() {
    document.getElementById('gsLiderNombre').textContent = lider.nombre;
    const lista = document.getElementById('gsGrupos');
    lista.innerHTML = grupos.map(g =>
      `<button class="grupo-btn" onclick="elegirGrupo(${g.id}, ${JSON.stringify(g.nombre).replace(/"/g, '&quot;')})">${g.nombre}</button>`
    ).join('');
    document.getElementById('grupoSelector').style.display = 'flex';
  }

  function elegirGrupo(id, nombre) {
    grupo = { id, nombre };
    sessionStorage.setItem('grupo', JSON.stringify(grupo));
    document.getElementById('grupoSelector').style.display = 'none';
    loadDiscipulos();
  }

  // Auto-seleccionar si hay un solo grupo
  if (!grupo) {
    if (grupos.length === 1) {
      grupo = grupos[0];
      sessionStorage.setItem('grupo', JSON.stringify(grupo));
    } else if (grupos.length > 1) {
      showGrupoSelector();
    }
  }

  function fmtFecha(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  async function loadReunion() {
    if (!grupo) return;
    try {
      const res = await fetch(`${API_URL}/reunion/grupo/${grupo.id}/${selectedDate}`);
      const data = await res.json();
      document.getElementById('reunionObs').value = data.observacion || '';
    } catch (err) {
      document.getElementById('reunionObs').value = '';
    }
  }

  async function loadDiscipulos() {
    if (!grupo) return;
    try {
      const res = await fetch(`${API_URL}/discipulos/grupo/${grupo.id}`);
      const data = await res.json();
      people = (data.discipulos || []).map(d => ({ id: d.id, name: d.nombre, phone: d.celular || '', fnac: d.fecha_nacimiento || '', obs: '', status: 'a' }));
    } catch (err) {
      people = [];
    }
    await loadAsistencia();
  }

  function dateObj() { return new Date(selectedDate + 'T12:00:00'); }
  function todayStr() { return dateObj().toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long', year:'numeric' }); }
  function todayShort() { return dateObj().toLocaleDateString('es-AR'); }

  function setDate(val) {
    selectedDate = val;
    document.getElementById('date-pill').textContent = todayStr();
    loadReunion();
    loadAsistencia();
  }

  const dateInput = document.getElementById('date-input');
  dateInput.value = selectedDate;
  dateInput.addEventListener('change', () => {
    if (dateInput.value !== selectedDate) {
      setDate(dateInput.value);
    }
  });
  document.getElementById('datePillWrap').addEventListener('click', () => {
    try { dateInput.showPicker(); } catch(e) { dateInput.focus(); }
  });
  setDate(selectedDate);

  async function loadAsistencia() {
    people.forEach(p => { p.status = 'a'; p.obs = ''; });
    if (!grupo) { render(); return; }
    try {
      const res = await fetch(`${API_URL}/asistencia/grupo/${grupo.id}/${selectedDate}`);
      const data = await res.json();
      if (data.registros && data.registros.length > 0) {
        data.registros.forEach(reg => {
          const person = people.find(p => p.id === reg.discipulo_id);
          if (person) {
            person.status = reg.presente ? 'p' : 'a';
            person.phone = reg.celular || person.phone;
            person.obs = reg.observacion || '';
          }
        });
      }
      render();
    } catch (err) {
      console.error('Error cargando asistencia:', err);
      render();
    }
  }

  function initials(n) {
    return n.trim().split(' ').slice(0,2).map(w=>w[0].toUpperCase()).join('');
  }

  function render() {
    const grupoLink = grupos.length > 1
      ? ` · <button class="lider-name-btn" onclick="showGrupoSelector()" title="Cambiar grupo">${grupo?.nombre || ''}</button>`
      : (grupo ? ` · ${grupo.nombre}` : '');
    document.getElementById('headerInfo').innerHTML = `<button class="lider-name-btn" onclick="openPerfilModal()">${lider.nombre}</button>${grupoLink} • ${people.length} discípulos`;
    const list = document.getElementById('list');
    if (!people.length) {
      list.innerHTML = '<div class="empty">📋 No hay discípulos agregados</div>';
      document.getElementById('sTotal').textContent = '0';
      document.getElementById('sPres').textContent = '0';
      document.getElementById('sAus').textContent = '0';
      return;
    }

    const total = people.length;
    const pres = people.filter(p => p.status === 'p').length;
    const aus = total - pres;

    document.getElementById('sTotal').textContent = total;
    document.getElementById('sPres').textContent = pres;
    document.getElementById('sAus').textContent = aus;

    list.innerHTML = people.map((p, i) => `
      <div class="card ${p.status === 'p' ? 'presente' : 'ausente'}">
        <div class="avatar">${initials(p.name)}</div>
        <div class="info">
          <div class="name">${p.name}</div>
          <input class="phone-input" type="tel" value="${p.phone}" placeholder="Celular" onchange="people[${i}].phone = this.value" />
          ${p.fnac ? `<div style="font-size:10px;color:var(--muted);margin-top:1px">🎂 ${fmtFecha(p.fnac)}</div>` : ''}
          <div class="status-txt">${p.status === 'p' ? '✓ Presente' : '✗ Ausente'}</div>
          <input class="obs-input" type="text" value="${p.obs}" placeholder="Observación" onchange="people[${i}].obs = this.value" />
        </div>
        <div class="btns">
          <button class="bp ${p.status === 'p' ? 'on' : ''}" onclick="people[${i}].status = 'p'; render()">✓</button>
          <button class="ba ${p.status === 'a' ? 'on' : ''}" onclick="people[${i}].status = 'a'; render()">✗</button>
          <button class="edit-disc-btn" onclick="openEditDisc(${i})">✏</button>
        </div>
      </div>
    `).join('');
  }

  function addPerson() {
    const nombre = document.getElementById('nNombre').value.trim();
    const celular = document.getElementById('nCel').value.trim();
    const fnac = document.getElementById('nFechaNac').value;

    if (!nombre) {
      toast('Ingresa el nombre', 'err');
      return;
    }

    people.push({ name: nombre, phone: celular, fnac, obs: '', status: 'a' });
    closeAddDiscModal();
    render();
    toast('Discípulo agregado', 'ok');
  }

  async function guardar() {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;

    try {
      const newPeople = people.filter(p => !p.id);
      for (const person of newPeople) {
        const resNew = await fetch(`${API_URL}/discipulos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grupo_id: grupo.id,
            nombre: person.name,
            celular: person.phone,
            fecha_nacimiento: person.fnac || null
          })
        });

        if (!resNew.ok) {
          const errData = await resNew.json().catch(() => null);
          throw new Error(errData?.error || 'No se pudo crear el discípulo');
        }

        const dataNew = await resNew.json();
        person.id = dataNew.id;
      }

      const registros = people.map(p => ({
        discipulo_id: p.discipulo_id ?? p.id,
        presente: p.status === 'p',
        celular: p.phone,
        observacion: p.obs
      }));

      const res = await fetch(`${API_URL}/asistencia`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          grupo_id: grupo.id,
          fecha: selectedDate,
          registros
        })
      });

      if (res.ok) {
        const obsReunion = document.getElementById('reunionObs').value.trim();
        await fetch(`${API_URL}/reunion`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ grupo_id: grupo.id, fecha: selectedDate, observacion: obsReunion })
        });
        toast('✓ Asistencia guardada en la BD', 'ok');
      } else {
        const errData = await res.json().catch(() => null);
        toast(errData?.error ? `Error: ${errData.error}` : 'Error al guardar', 'err');
      }
    } catch (err) {
      toast(err.message.includes('Error') ? err.message : 'Error de conexión', 'err');
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }

  function toggleAll() {
    const allPresent = people.every(p => p.status === 'p');
    people.forEach(p => { p.status = allPresent ? 'a' : 'p'; });
    render();
  }

  function descargarCSV() {
    if (!people.length) {
      toast('No hay datos para descargar', 'err');
      return;
    }

    const fecha = todayShort();
    const header = ['Nombre', 'Celular', 'Estado', 'Observación'];
    const rows = people.map(p => [
      p.name,
      p.phone,
      p.status === 'p' ? 'Presente' : 'Ausente',
      p.obs
    ]);

    const csv = [header, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `asistencia_${fecha}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function imprimirPDF() {
    if (!people.length) {
      toast('No hay datos para imprimir', 'err');
      return;
    }

    const fecha = todayShort();
    const pres = people.filter(p => p.status === 'p').length;
    const aus = people.length - pres;
    const obsReunion = document.getElementById('reunionObs').value.trim();

    const filas = people.map((p, i) => `
      <tr style="background:${p.status==='p'?'#EBF8F3':'#FCECEA'}">
        <td style="padding:7px 8px;border-bottom:1px solid #eee">${i+1}</td>
        <td style="padding:7px 8px;border-bottom:1px solid #eee;font-weight:500">${p.name}</td>
        <td style="padding:7px 8px;border-bottom:1px solid #eee;font-family:monospace;font-size:12px">${p.phone||''}</td>
        <td style="padding:7px 8px;border-bottom:1px solid #eee;font-weight:600;color:${p.status==='p'?'#1D9E75':'#D04030'}">${p.status==='p'?'Presente':'Ausente'}</td>
        <td style="padding:7px 8px;border-bottom:1px solid #eee;font-size:12px;color:#555">${p.obs||''}</td>
      </tr>`).join('');

    const report = document.getElementById('printReport');
    report.innerHTML = `
      <div style="font-family:Arial,sans-serif;padding:24px;max-width:780px;margin:0 auto">
        <div style="text-align:center;border-bottom:3px solid #5B4FD4;padding-bottom:14px;margin-bottom:20px">
          <h1 style="color:#5B4FD4;font-size:22px;margin:0 0 6px">Asistencia al Grupo</h1>
          <p style="margin:0;color:#444;font-size:13px">
            <strong>Fecha:</strong> ${fecha} | <strong>Líder:</strong> ${lider.nombre}
          </p>
        </div>
        <div style="display:flex;gap:12px;margin-bottom:20px;text-align:center">
          <div style="flex:1;border:1px solid #ccc;border-radius:8px;padding:10px">
            <div style="font-size:26px;font-weight:700">${people.length}</div>
            <div style="font-size:10px;color:#888;text-transform:uppercase">Total</div>
          </div>
          <div style="flex:1;border:2px solid #1D9E75;border-radius:8px;padding:10px;background:#EBF8F3">
            <div style="font-size:26px;font-weight:700;color:#1D9E75">${pres}</div>
            <div style="font-size:10px;color:#888;text-transform:uppercase">Presentes</div>
          </div>
          <div style="flex:1;border:2px solid #D04030;border-radius:8px;padding:10px;background:#FCECEA">
            <div style="font-size:26px;font-weight:700;color:#D04030">${aus}</div>
            <div style="font-size:10px;color:#888;text-transform:uppercase">Ausentes</div>
          </div>
        </div>
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:#f5f4f0;border-bottom:2px solid #5B4FD4">
              <th style="padding:10px;text-align:left;font-weight:600">#</th>
              <th style="padding:10px;text-align:left;font-weight:600">Nombre</th>
              <th style="padding:10px;text-align:left;font-weight:600">Celular</th>
              <th style="padding:10px;text-align:left;font-weight:600">Estado</th>
              <th style="padding:10px;text-align:left;font-weight:600">Observación</th>
            </tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>
        ${obsReunion ? `
        <div style="margin-top:20px;border-top:2px solid #5B4FD4;padding-top:14px">
          <div style="font-size:11px;font-weight:700;color:#5B4FD4;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Observación del encuentro</div>
          <p style="font-size:13px;color:#333;margin:0;line-height:1.5">${obsReunion}</p>
        </div>` : ''}
      </div>`;

    const element = document.getElementById('printReport');
    element.style.display = 'block';
    const opt = {
      margin: 10,
      filename: `asistencia_${fecha}.pdf`,
      image: { type: 'png', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
    };
    html2pdf().set(opt).from(element).save().then(() => {
      element.style.display = 'none';
      element.innerHTML = '';
    });
  }

  function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function logout() {
    if (confirm('¿Estás seguro de que deseas salir?')) {
      sessionStorage.clear();
      window.location.href = 'index.html';
    }
  }

  function openAddDiscModal() {
    document.getElementById('nNombre').value = '';
    document.getElementById('nCel').value = '';
    document.getElementById('nFechaNac').value = '';
    document.getElementById('modalAddDisc').classList.add('open');
    setTimeout(() => document.getElementById('nNombre').focus(), 100);
  }

  function closeAddDiscModal() {
    document.getElementById('modalAddDisc').classList.remove('open');
  }

  function openPerfilModal() {
    document.getElementById('pfNombre').value = lider.nombre || '';
    document.getElementById('pfEmail').value = lider.email || '';
    document.getElementById('pfCelular').value = lider.celular || '';
    document.getElementById('pfFechaNac').value = lider.fecha_nacimiento || '';
    document.getElementById('perfilMsg').className = 'modal-msg';
    document.getElementById('modalEditPerfil').classList.add('open');
  }

  function closePerfilModal() {
    document.getElementById('modalEditPerfil').classList.remove('open');
  }

  async function guardarPerfil() {
    const nombre = document.getElementById('pfNombre').value.trim();
    const email = document.getElementById('pfEmail').value.trim();
    const celular = document.getElementById('pfCelular').value.trim();
    const fechaNac = document.getElementById('pfFechaNac').value;
    const msg = document.getElementById('perfilMsg');
    const btn = document.getElementById('btnGuardarPerfil');

    msg.className = 'modal-msg';
    if (!nombre || !email) {
      msg.textContent = 'Nombre y email son requeridos';
      msg.className = 'modal-msg err';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Guardando...';
    try {
      const res = await fetch(`${API_URL}/lideres/${lider.id}/perfil`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lider_id: lider.id, nombre, email, celular, fecha_nacimiento: fechaNac || null })
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || 'Error al guardar';
        msg.className = 'modal-msg err';
      } else {
        lider.nombre = nombre;
        lider.email = email;
        lider.celular = celular;
        lider.fecha_nacimiento = fechaNac;
        sessionStorage.setItem('lider', JSON.stringify(lider));
        msg.textContent = '✓ Perfil actualizado';
        msg.className = 'modal-msg ok';
        render();
        setTimeout(() => closePerfilModal(), 1000);
      }
    } catch (err) {
      msg.textContent = 'Error de conexión';
      msg.className = 'modal-msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar cambios';
    }
  }

  let editingDiscIdx = null;

  function openEditDisc(idx) {
    editingDiscIdx = idx;
    const p = people[idx];
    document.getElementById('edNombre').value = p.name;
    document.getElementById('edCelular').value = p.phone || '';
    document.getElementById('edFechaNac').value = p.fnac || '';
    document.getElementById('editDiscMsg').className = 'modal-msg';
    document.getElementById('btnDarDeBaja').style.display = p.id ? 'block' : 'none';
    document.getElementById('modalEditDisc').classList.add('open');
  }

  function closeEditDiscModal() {
    document.getElementById('modalEditDisc').classList.remove('open');
    editingDiscIdx = null;
  }

  async function guardarDiscipulo() {
    const nombre = document.getElementById('edNombre').value.trim();
    const celular = document.getElementById('edCelular').value.trim();
    const fechaNac = document.getElementById('edFechaNac').value;
    const msg = document.getElementById('editDiscMsg');
    const btn = document.getElementById('btnGuardarDisc');

    msg.className = 'modal-msg';
    if (!nombre) {
      msg.textContent = 'El nombre es requerido';
      msg.className = 'modal-msg err';
      return;
    }

    const p = people[editingDiscIdx];
    people[editingDiscIdx].name = nombre;
    people[editingDiscIdx].phone = celular;
    people[editingDiscIdx].fnac = fechaNac;

    if (!p.id) {
      closeEditDiscModal();
      render();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Guardando...';
    try {
      const res = await fetch(`${API_URL}/discipulos/${p.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lider_id: lider.id, nombre, celular, fecha_nacimiento: fechaNac || null })
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || 'Error al guardar';
        msg.className = 'modal-msg err';
      } else {
        msg.textContent = '✓ Guardado';
        msg.className = 'modal-msg ok';
        render();
        setTimeout(() => closeEditDiscModal(), 1000);
      }
    } catch (err) {
      msg.textContent = 'Error de conexión';
      msg.className = 'modal-msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar cambios';
    }
  }

  async function darDeBajaDisc() {
    if (!confirm('¿Dar de baja este discípulo?')) return;
    const p = people[editingDiscIdx];
    if (p.id) {
      try {
        const res = await fetch(`${API_URL}/discipulos/${p.id}/activo`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lider_id: lider.id, activo: false })
        });
        if (!res.ok) { toast('Error al dar de baja', 'err'); return; }
      } catch (err) {
        toast('Error de conexión', 'err');
        return;
      }
    }
    people.splice(editingDiscIdx, 1);
    closeEditDiscModal();
    render();
    toast('Discípulo dado de baja', 'ok');
  }

  loadDiscipulos();
</script>

</body>
</html>

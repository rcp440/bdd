<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas - Asistencia</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg: #F5F4F0; --card: #FFFFFF; --text: #1A1A18; --muted: #8A8A80;
      --border: #E2E1DC; --green: #1D9E75; --green-bg: #EBF8F3;
      --red: #D04030; --red-bg: #FCECEA; --purple: #5B4FD4; --purple-bg: #EFEDFC;
      --radius: 14px; --radius-sm: 9px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); }
    .app { max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
    .header { padding: 52px 20px 12px; background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
    .header h1 span { color: var(--purple); }
    .back-btn { background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; }
    .back-btn:hover { border-color: var(--text); color: var(--text); }
    .tabs { display: flex; gap: 4px; }
    .tab-btn { flex: 1; padding: 8px; border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--muted); }
    .tab-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }
    .filters { padding: 14px 20px; display: flex; flex-direction: column; gap: 8px; }
    .filters select, .filters input[type="month"], .filters input[type="date"] {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 13px; font-family: 'DM Sans', sans-serif; background: var(--card); color: var(--text); outline: none;
    }
    .filters select:focus, .filters input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-bg); }
    .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .date-row label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .gen-btn { background: var(--purple); color: #fff; border: none; border-radius: var(--radius-sm); padding: 10px; font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }
    .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .section-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 12px 20px 6px; }
    .table-wrap { padding: 0 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { border-collapse: collapse; min-width: 100%; }
    th { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; background: var(--bg); padding: 8px 6px; border-bottom: 2px solid var(--purple); white-space: nowrap; text-align: center; }
    td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: center; font-size: 12px; white-space: nowrap; }
    .th-name, .cell-name { text-align: left; }
    .cell-name { font-weight: 500; font-size: 13px; padding-left: 8px; }
    .cell-p { color: var(--green); font-weight: 700; }
    .cell-a { color: var(--red); }
    .cell-none { color: var(--muted); }
    .cell-total { font-weight: 700; }
    .obs-list { padding: 0 20px; }
    .obs-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 6px; }
    .obs-date { font-size: 11px; font-weight: 600; color: var(--purple); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
    .obs-text { font-size: 13px; color: var(--text); line-height: 1.5; }
    .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin: 0 20px 10px; }
    .person-name { font-size: 17px; font-weight: 600; }
    .person-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .person-stat { font-size: 13px; margin-top: 8px; color: var(--text); }
    .record-row { display: flex; align-items: center; padding: 9px 20px; border-bottom: 1px solid var(--border); gap: 12px; }
    .record-date { font-size: 13px; font-weight: 500; min-width: 50px; }
    .record-status { font-size: 12px; font-weight: 600; min-width: 80px; }
    .record-obs { font-size: 12px; color: var(--muted); flex: 1; }
    .pdf-btn { display: block; margin: 8px 20px; background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; width: calc(100% - 40px); text-align: center; }
    .empty { text-align: center; padding: 32px 20px; color: var(--muted); font-size: 14px; }
    #printReport { display: none; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <h1>Estadísticas</h1>
      <button class="back-btn" onclick="window.location.href='app.html'">← Volver</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabBtnM" onclick="switchTab('mensual')">Mensual</button>
      <button class="tab-btn" id="tabBtnP" onclick="switchTab('persona')">Por persona</button>
      <button class="tab-btn" id="tabBtnE" onclick="switchTab('entrevistas')">Entrevistas</button>
    </div>
  </div>

  <!-- Tab Mensual -->
  <div id="tabMensual">
    <div class="filters">
      <select id="selectLiderM" onchange="loadGruposM()"><option value="">-- Seleccionar líder --</option></select>
      <select id="selectGrupoM"><option value="">-- Seleccionar GC --</option></select>
      <input type="month" id="selectMes">
      <button class="gen-btn" id="btnGenM" onclick="generarMensual()">Generar estadística</button>
    </div>
    <div id="resultMensual"></div>
    <button id="btnPdfM" class="pdf-btn" style="display:none" onclick="pdfMensual()">Descargar PDF mensual</button>
  </div>

  <!-- Tab Por persona -->
  <div id="tabPersona" style="display:none">
    <div class="filters">
      <select id="selectLiderP" onchange="loadDiscipulosP()"><option value="">-- Seleccionar líder --</option></select>
      <select id="selectDisc"><option value="">-- Seleccionar persona --</option></select>
      <div class="date-row">
        <div>
          <label>Desde</label>
          <input type="date" id="desde">
        </div>
        <div>
          <label>Hasta</label>
          <input type="date" id="hasta">
        </div>
      </div>
      <button class="gen-btn" id="btnGenP" onclick="buscarPersona()">Buscar</button>
    </div>
    <div id="resultPersona"></div>
    <button id="btnPdfP" class="pdf-btn" style="display:none" onclick="pdfPersona()">Descargar PDF persona</button>
  </div>

  <!-- Tab Entrevistas -->
  <div id="tabEntrevistas" style="display:none">
    <div class="filters">
      <select id="selectLiderE"><option value="">Todos los líderes</option></select>
      <div class="date-row">
        <div>
          <label>Desde</label>
          <input type="date" id="desdeE">
        </div>
        <div>
          <label>Hasta</label>
          <input type="date" id="hastaE">
        </div>
      </div>
      <button class="gen-btn" id="btnGenE" onclick="generarEntrevistas()">Generar informe</button>
    </div>
    <div id="resultEntrevistas"></div>
    <button id="btnPdfE" class="pdf-btn" style="display:none" onclick="pdfEntrevistas()">Descargar PDF entrevistas</button>
  </div>
</div>

<div id="printReport"></div>

<script>
  const API_URL = 'http://localhost:3000/api';
  const lider = JSON.parse(sessionStorage.getItem('lider'));

  if (!lider || (lider.rol !== 'admin' && lider.rol !== 'pastoral')) {
    window.location.href = 'index.html';
    throw new Error('Sin permisos');
  }

  if (lider.rol === 'pastoral') {
    document.getElementById('tabBtnM').style.display = 'none';
    document.getElementById('tabBtnP').style.display = 'none';
    switchTab('entrevistas');
  }

  let lastMensualData = null;
  let lastPersonaData = null;
  let lastEntrevistasData = null;

  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  document.getElementById('selectMes').value = `${yyyy}-${mm}`;
  document.getElementById('desde').value = `${yyyy}-${mm}-01`;
  document.getElementById('hasta').value = `${yyyy}-${mm}-${dd}`;
  document.getElementById('desdeE').value = `${yyyy}-${mm}-01`;
  document.getElementById('hastaE').value = `${yyyy}-${mm}-${dd}`;

  function switchTab(tab) {
    ['mensual','persona','entrevistas'].forEach(t => {
      document.getElementById(`tab${t.charAt(0).toUpperCase()+t.slice(1)}`).style.display = t === tab ? 'block' : 'none';
      document.getElementById(`tabBtn${t === 'mensual' ? 'M' : t === 'persona' ? 'P' : 'E'}`).classList.toggle('active', t === tab);
    });
  }

  async function loadLideres() {
    try {
      const res = await fetch(`${API_URL}/lideres?lider_id=${lider.id}`);
      const data = await res.json();
      const opts = (data.lideres || []).filter(l => l.activo)
        .map(l => `<option value="${l.id}">${l.nombre}</option>`).join('');
      ['selectLiderM', 'selectLiderP'].forEach(id => {
        document.getElementById(id).innerHTML = '<option value="">-- Seleccionar líder --</option>' + opts;
      });
      document.getElementById('selectLiderE').innerHTML =
        '<option value="">Todos los líderes</option>' + opts;
    } catch (err) {}
  }

  async function loadGruposM() {
    const liderId = document.getElementById('selectLiderM').value;
    const sel = document.getElementById('selectGrupoM');
    sel.innerHTML = '<option value="">-- Seleccionar GC --</option>';
    if (!liderId) return;
    try {
      const res = await fetch(`${API_URL}/grupos/${liderId}`);
      const data = await res.json();
      sel.innerHTML = '<option value="">-- Seleccionar GC --</option>' +
        (data.grupos || []).map(g => `<option value="${g.id}">${g.nombre}</option>`).join('');
    } catch (err) {}
  }

  async function loadDiscipulosP() {
    const liderId = document.getElementById('selectLiderP').value;
    const sel = document.getElementById('selectDisc');
    sel.innerHTML = '<option value="">-- Seleccionar persona --</option>';
    if (!liderId) return;
    try {
      const res = await fetch(`${API_URL}/discipulos/${liderId}`);
      const data = await res.json();
      sel.innerHTML = '<option value="">-- Seleccionar persona --</option>' +
        (data.discipulos || []).map(d => `<option value="${d.id}">${d.nombre}</option>`).join('');
    } catch (err) {}
  }

  function fmtShort(dateStr) {
    if (!dateStr) return '';
    const d = new Date(String(dateStr).substring(0, 10) + 'T12:00:00');
    return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
  }

  function fmtLong(dateStr) {
    if (!dateStr) return '';
    const d = new Date(String(dateStr).substring(0, 10) + 'T12:00:00');
    return d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function mesNombre(anio, mesNum) {
    const d = new Date(parseInt(anio), parseInt(mesNum) - 1, 1);
    return d.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
  }

  function buildMatrix(asistencia) {
    const discMap = {};
    const fechaSet = new Set();
    asistencia.forEach(row => {
      if (!discMap[row.discipulo_id]) {
        discMap[row.discipulo_id] = { nombre: row.nombre, fechas: {} };
      }
      if (row.fecha) {
        const f = String(row.fecha).substring(0, 10);
        fechaSet.add(f);
        discMap[row.discipulo_id].fechas[f] = row.presente;
      }
    });
    const fechas = [...fechaSet].sort();
    const disciples = Object.values(discMap).sort((a, b) => a.nombre.localeCompare(b.nombre));
    return { fechas, disciples };
  }

  async function generarMensual() {
    const grupoId = document.getElementById('selectGrupoM').value;
    const mes = document.getElementById('selectMes').value;
    const btn = document.getElementById('btnGenM');
    const result = document.getElementById('resultMensual');

    if (!grupoId || !mes) {
      result.innerHTML = '<div class="empty">Seleccioná un GC y mes</div>';
      return;
    }

    const [anio, mesNum] = mes.split('-');
    btn.disabled = true;
    btn.textContent = 'Cargando...';
    result.innerHTML = '<div class="empty">Cargando...</div>';
    document.getElementById('btnPdfM').style.display = 'none';

    try {
      const res = await fetch(`${API_URL}/stats/mensual/grupo/${grupoId}/${anio}/${mesNum}?by=${lider.id}`);
      const data = await res.json();
      if (!res.ok) {
        result.innerHTML = `<div class="empty">${data.error || 'Error al cargar'}</div>`;
        return;
      }
      lastMensualData = { data, anio, mesNum };
      renderMensual(data, anio, mesNum);
      document.getElementById('btnPdfM').style.display = 'block';
    } catch (err) {
      result.innerHTML = '<div class="empty">Error de conexión</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generar estadística';
    }
  }

  function renderMensual(data, anio, mesNum) {
    const result = document.getElementById('resultMensual');
    const { asistencia, reuniones, grupo: gt } = data;
    const { fechas, disciples } = buildMatrix(asistencia);

    if (!disciples.length) {
      result.innerHTML = '<div class="empty">Sin datos para este mes</div>';
      return;
    }

    const headers = fechas.map(f => `<th>${fmtShort(f)}</th>`).join('');
    const rows = disciples.map(d => {
      const cells = fechas.map(f => {
        const v = d.fechas[f];
        if (v === undefined || v === null) return `<td class="cell-none">-</td>`;
        if (v === true || v === 1) return `<td class="cell-p">✓</td>`;
        return `<td class="cell-a">✗</td>`;
      }).join('');
      const total = Object.keys(d.fechas).length;
      const pres = Object.values(d.fechas).filter(v => v === true || v === 1).length;
      return `<tr><td class="cell-name">${d.nombre}</td>${cells}<td class="cell-total">${pres}/${total}</td></tr>`;
    }).join('');

    const obsSection = reuniones && reuniones.length ? `
      <div class="section-label" style="margin-top:8px">Observaciones del mes</div>
      <div class="obs-list">
        ${reuniones.map(r => `
          <div class="obs-card">
            <div class="obs-date">${fmtLong(r.fecha)}</div>
            <div class="obs-text">${r.observacion}</div>
          </div>`).join('')}
      </div>` : '';

    result.innerHTML = `
      <div class="section-label">${gt?.lider_nombre} · ${gt?.grupo_nombre} — ${mesNombre(anio, mesNum)}</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="th-name">Nombre</th>${headers}<th>Total</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${obsSection}`;
  }

  async function buscarPersona() {
    const discId = document.getElementById('selectDisc').value;
    const desde = document.getElementById('desde').value;
    const hasta = document.getElementById('hasta').value;
    const btn = document.getElementById('btnGenP');
    const result = document.getElementById('resultPersona');

    if (!discId || !desde || !hasta) {
      result.innerHTML = '<div class="empty">Completa todos los campos</div>';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Buscando...';
    result.innerHTML = '<div class="empty">Cargando...</div>';
    document.getElementById('btnPdfP').style.display = 'none';

    try {
      const res = await fetch(`${API_URL}/stats/persona/${discId}?desde=${desde}&hasta=${hasta}&by=${lider.id}`);
      const data = await res.json();
      if (!res.ok) {
        result.innerHTML = `<div class="empty">${data.error || 'Error al cargar'}</div>`;
        return;
      }
      lastPersonaData = { data, desde, hasta };
      renderPersona(data, desde, hasta);
      document.getElementById('btnPdfP').style.display = 'block';
    } catch (err) {
      result.innerHTML = '<div class="empty">Error de conexión</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Buscar';
    }
  }

  function renderPersona(data, desde, hasta) {
    const result = document.getElementById('resultPersona');
    const { registros, discipulo } = data;
    if (!discipulo) { result.innerHTML = '<div class="empty">Persona no encontrada</div>'; return; }
    const total = registros.length;
    const presentes = registros.filter(r => r.presente === true || r.presente === 1).length;
    const pct = total > 0 ? Math.round(presentes / total * 100) : 0;
    const pctColor = pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--muted)' : 'var(--red)';

    const rows = registros.length ? registros.map(r => {
      const f = String(r.fecha).substring(0, 10);
      const presente = r.presente === true || r.presente === 1;
      return `<div class="record-row">
        <div class="record-date">${fmtShort(f)}</div>
        <div class="record-status" style="color:${presente ? 'var(--green)' : 'var(--red)'}">${presente ? '✓ Presente' : '✗ Ausente'}</div>
        <div class="record-obs">${r.observacion || ''}</div>
      </div>`;
    }).join('') : '<div class="empty" style="padding:16px">Sin registros en este período</div>';

    result.innerHTML = `
      <div class="summary-card">
        <div class="person-name">${discipulo.nombre}</div>
        <div class="person-sub">Líder: ${discipulo.lider_nombre}${discipulo.celular ? ' · ' + discipulo.celular : ''}</div>
        <div class="person-sub">Período: ${fmtShort(desde)} al ${fmtShort(hasta)}</div>
        <div class="person-stat">
          Asistió <strong>${presentes}</strong> de <strong>${total}</strong> reuniones
          <span style="color:${pctColor};font-weight:600"> (${pct}%)</span>
        </div>
      </div>
      ${rows}`;
  }

  function pdfMensual() {
    if (!lastMensualData) return;
    const { data, anio, mesNum } = lastMensualData;
    const { asistencia, reuniones, grupo: gt } = data;
    const lt = gt ? { nombre: `${gt.lider_nombre} · ${gt.grupo_nombre}` } : { nombre: '' };
    const { fechas, disciples } = buildMatrix(asistencia);

    const headers = fechas.map(f =>
      `<th style="padding:5px 6px;border:1px solid #ddd;font-size:10px;font-weight:600">${fmtShort(f)}</th>`
    ).join('');

    const rows = disciples.map(d => {
      const cells = fechas.map(f => {
        const v = d.fechas[f];
        let txt = '-', color = '#aaa';
        if (v === true || v === 1) { txt = '✓'; color = '#1D9E75'; }
        else if (v === false || v === 0) { txt = '✗'; color = '#D04030'; }
        return `<td style="padding:5px 6px;border:1px solid #ddd;text-align:center;color:${color};font-weight:600;font-size:12px">${txt}</td>`;
      }).join('');
      const total = Object.keys(d.fechas).length;
      const pres = Object.values(d.fechas).filter(v => v === true || v === 1).length;
      return `<tr>
        <td style="padding:6px 8px;border:1px solid #ddd;font-weight:500;font-size:12px">${d.nombre}</td>
        ${cells}
        <td style="padding:5px 6px;border:1px solid #ddd;text-align:center;font-weight:700;font-size:12px">${pres}/${total}</td>
      </tr>`;
    }).join('');

    const obsHtml = reuniones && reuniones.length ? `
      <div style="margin-top:24px;border-top:2px solid #5B4FD4;padding-top:14px">
        <div style="font-size:11px;font-weight:700;color:#5B4FD4;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px">Observaciones del mes</div>
        ${reuniones.map(r => `
          <div style="margin-bottom:10px">
            <div style="font-size:11px;font-weight:600;color:#555;margin-bottom:2px">${fmtLong(r.fecha)}</div>
            <div style="font-size:12px;color:#333;padding-left:8px;border-left:3px solid #5B4FD4;line-height:1.5">${r.observacion}</div>
          </div>`).join('')}
      </div>` : '';

    const report = document.getElementById('printReport');
    report.innerHTML = `
      <div style="font-family:Arial,sans-serif;padding:24px;max-width:1000px;margin:0 auto">
        <div style="text-align:center;border-bottom:3px solid #5B4FD4;padding-bottom:14px;margin-bottom:20px">
          <h1 style="color:#5B4FD4;font-size:20px;margin:0 0 4px">Estadística Mensual de Asistencia</h1>
          <p style="margin:0;color:#444;font-size:13px">Líder: ${lt?.nombre} | ${mesNombre(anio, mesNum)}</p>
        </div>
        <div style="overflow-x:auto">
          <table style="border-collapse:collapse;width:100%">
            <thead>
              <tr style="background:#f5f4f0">
                <th style="padding:8px;border:1px solid #ddd;text-align:left;font-size:11px;font-weight:600">Nombre</th>
                ${headers}
                <th style="padding:5px 6px;border:1px solid #ddd;font-size:10px;font-weight:600">Total</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${obsHtml}
      </div>`;

    report.style.display = 'block';
    html2pdf().set({
      margin: 8, filename: `mensual_${lt?.nombre}_${anio}-${mesNum}.pdf`,
      image: { type: 'png', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' }
    }).from(report).save().then(() => {
      report.style.display = 'none';
      report.innerHTML = '';
    });
  }

  function pdfPersona() {
    if (!lastPersonaData) return;
    const { data, desde, hasta } = lastPersonaData;
    const { registros, discipulo } = data;
    const total = registros.length;
    const presentes = registros.filter(r => r.presente === true || r.presente === 1).length;
    const pct = total > 0 ? Math.round(presentes / total * 100) : 0;
    const pctColor = pct >= 70 ? '#1D9E75' : '#D04030';

    const rows = registros.map(r => {
      const f = String(r.fecha).substring(0, 10);
      const presente = r.presente === true || r.presente === 1;
      return `<tr style="background:${presente ? '#EBF8F3' : '#FCECEA'}">
        <td style="padding:7px 10px;border-bottom:1px solid #eee">${fmtShort(f)}</td>
        <td style="padding:7px 10px;border-bottom:1px solid #eee;font-weight:600;color:${presente ? '#1D9E75' : '#D04030'}">${presente ? 'Presente' : 'Ausente'}</td>
        <td style="padding:7px 10px;border-bottom:1px solid #eee;font-size:12px;color:#555">${r.observacion || ''}</td>
      </tr>`;
    }).join('');

    const report = document.getElementById('printReport');
    report.innerHTML = `
      <div style="font-family:Arial,sans-serif;padding:24px;max-width:700px;margin:0 auto">
        <div style="text-align:center;border-bottom:3px solid #5B4FD4;padding-bottom:14px;margin-bottom:20px">
          <h1 style="color:#5B4FD4;font-size:20px;margin:0 0 4px">Estadística por Persona</h1>
          <p style="margin:0;color:#444;font-size:14px;font-weight:600">${discipulo.nombre}</p>
          <p style="margin:4px 0 0;color:#666;font-size:12px">Líder: ${discipulo.lider_nombre}${discipulo.celular ? ' · ' + discipulo.celular : ''}</p>
          <p style="margin:2px 0 0;color:#666;font-size:12px">Período: ${fmtShort(desde)} al ${fmtShort(hasta)}</p>
        </div>
        <div style="display:flex;gap:12px;margin-bottom:20px;text-align:center">
          <div style="flex:1;border:1px solid #ccc;border-radius:8px;padding:10px">
            <div style="font-size:24px;font-weight:700">${total}</div>
            <div style="font-size:10px;color:#888;text-transform:uppercase">Reuniones</div>
          </div>
          <div style="flex:1;border:2px solid #1D9E75;border-radius:8px;padding:10px;background:#EBF8F3">
            <div style="font-size:24px;font-weight:700;color:#1D9E75">${presentes}</div>
            <div style="font-size:10px;color:#888;text-transform:uppercase">Presentes</div>
          </div>
          <div style="flex:1;border:2px solid ${pctColor};border-radius:8px;padding:10px">
            <div style="font-size:24px;font-weight:700;color:${pctColor}">${pct}%</div>
            <div style="font-size:10px;color:#888;text-transform:uppercase">Asistencia</div>
          </div>
        </div>
        ${rows.length ? `
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:#f5f4f0;border-bottom:2px solid #5B4FD4">
              <th style="padding:8px 10px;text-align:left;font-size:11px;font-weight:600">Fecha</th>
              <th style="padding:8px 10px;text-align:left;font-size:11px;font-weight:600">Estado</th>
              <th style="padding:8px 10px;text-align:left;font-size:11px;font-weight:600">Observación</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>` : '<p style="text-align:center;color:#888">Sin registros en este período</p>'}
      </div>`;

    report.style.display = 'block';
    html2pdf().set({
      margin: 10, filename: `persona_${discipulo.nombre}_${desde}_${hasta}.pdf`,
      image: { type: 'png', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
    }).from(report).save().then(() => {
      report.style.display = 'none';
      report.innerHTML = '';
    });
  }

  // ==================== ENTREVISTAS ====================

  async function generarEntrevistas() {
    const desdeE  = document.getElementById('desdeE').value;
    const hastaE  = document.getElementById('hastaE').value;
    const liderE  = document.getElementById('selectLiderE').value;
    const btn     = document.getElementById('btnGenE');
    const result  = document.getElementById('resultEntrevistas');

    if (!desdeE || !hastaE) {
      result.innerHTML = '<div class="empty">Completá las fechas</div>';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Cargando...';
    result.innerHTML = '<div class="empty">Cargando...</div>';
    document.getElementById('btnPdfE').style.display = 'none';

    try {
      const params = new URLSearchParams({ desde: desdeE, hasta: hastaE, by: lider.id });
      if (liderE) params.append('filtro_lider_id', liderE);
      const res = await fetch(`${API_URL}/stats/entrevistas?${params}`);
      const data = await res.json();
      if (!res.ok) { result.innerHTML = `<div class="empty">${data.error || 'Error'}</div>`; return; }
      lastEntrevistasData = { data, desdeE, hastaE };
      renderEntrevistas(data.entrevistas || [], desdeE, hastaE);
      document.getElementById('btnPdfE').style.display = 'block';
    } catch (err) {
      result.innerHTML = '<div class="empty">Error de conexión</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generar informe';
    }
  }

  function renderEntrevistas(rows, desdeE, hastaE) {
    const result = document.getElementById('resultEntrevistas');
    if (!rows.length) {
      result.innerHTML = '<div class="empty">Sin entrevistas en ese período</div>';
      return;
    }
    const filas = rows.map(e => {
      const meta = [e.horario, e.lugar].filter(Boolean).join(' · ');
      return `
        <div class="obs-card" style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:4px">
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--text)">${e.discipulo}</div>
              <div style="font-size:11px;color:var(--muted)">${e.lider}${e.gc ? ' · ' + e.gc : ''}</div>
            </div>
            <div style="text-align:right">
              <div class="obs-date">${fmtShort(e.fecha)}</div>
              ${meta ? `<div style="font-size:11px;color:var(--muted)">${meta}</div>` : ''}
              ${e.entrevistador !== e.lider ? `<div style="font-size:10px;color:var(--purple)">por ${e.entrevistador}</div>` : ''}
            </div>
          </div>
          ${e.temas ? `<div class="obs-text" style="margin-top:8px;border-left:3px solid var(--purple);padding-left:10px;white-space:pre-wrap">${e.temas.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>` : ''}
        </div>`;
    }).join('');
    result.innerHTML = `
      <div class="section-label" style="padding-left:0;margin:0 20px 8px">
        ${rows.length} entrevista${rows.length !== 1 ? 's' : ''} — ${fmtShort(desdeE)} al ${fmtShort(hastaE)}
      </div>
      <div class="obs-list">${filas}</div>`;
  }

  function pdfEntrevistas() {
    if (!lastEntrevistasData) return;
    const { data, desdeE, hastaE } = lastEntrevistasData;
    const rows = data.entrevistas || [];
    const tarjetas = rows.map(e => {
      const meta = [e.horario, e.lugar].filter(Boolean).join(' · ');
      const temas = e.temas ? e.temas.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
      return `
        <div style="border:1px solid #ddd;border-radius:6px;padding:10px 12px;margin-bottom:8px;page-break-inside:avoid">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:${temas ? '8px' : '0'}">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600;color:#1a1a1a">${e.discipulo}</div>
              <div style="font-size:11px;color:#666;margin-top:2px">${e.lider}${e.gc ? ' · ' + e.gc : ''}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:11px;font-weight:600;color:#5B4FD4;text-transform:uppercase">${fmtShort(e.fecha)}</div>
              ${meta ? `<div style="font-size:10px;color:#888;margin-top:2px">${meta}</div>` : ''}
            </div>
          </div>
          ${temas ? `<div style="font-size:12px;color:#333;line-height:1.6;border-left:3px solid #5B4FD4;padding-left:10px;white-space:pre-wrap">${temas}</div>` : ''}
        </div>`;
    }).join('');
    const report = document.getElementById('printReport');
    report.innerHTML = `
      <div style="font-family:Arial,sans-serif;padding:20px;width:900px">
        <div style="text-align:center;border-bottom:3px solid #5B4FD4;padding-bottom:12px;margin-bottom:16px">
          <h1 style="color:#5B4FD4;font-size:18px;margin:0 0 4px">Informe de Entrevistas</h1>
          <p style="margin:0;color:#444;font-size:12px">Período: ${fmtShort(desdeE)} al ${fmtShort(hastaE)} · ${rows.length} entrevista${rows.length !== 1 ? 's' : ''}</p>
        </div>
        ${tarjetas}
      </div>`;
    report.style.cssText = 'display:block;position:fixed;left:-9999px;top:0;background:#fff';
    html2pdf().set({
      margin: 10,
      filename: `entrevistas_${desdeE}_${hastaE}.pdf`,
      image: { type: 'png', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, windowWidth: 960 },
      jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' },
      pagebreak: { mode: ['css', 'legacy'] }
    }).from(report).save().then(() => {
      report.style.cssText = 'display:none';
      report.innerHTML = '';
    });
  }

  loadLideres();
</script>
</body>
</html>
